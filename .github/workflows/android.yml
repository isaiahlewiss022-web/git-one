# Builds the Hanzi Flow Android app (a signed APK) and attaches it to a GitHub release.
# Download it on your phone from: Releases → "Hanzi Flow for Android" → HanziFlow.apk
name: Build Hanzi Flow Android APK
on:
  push:
    branches: [main]
    paths: ['hanzi-flow/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
      - name: Bundle the web app into the APK assets
        run: |
          mkdir -p hanzi-flow/android/app/src/main/assets/www
          rsync -a --delete --exclude android --exclude tools --exclude sw.js hanzi-flow/ hanzi-flow/android/app/src/main/assets/www/
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build release APK
        working-directory: hanzi-flow/android
        run: |
          gradle --no-daemon assembleRelease -PversionCode=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/HanziFlow.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: HanziFlow-apk
          path: HanziFlow.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: Hanzi Flow for Android (build ${{ github.run_number }})
          make_latest: true
          body: |
            Hanzi Flow as an Android app. Open this page on your phone, download **HanziFlow.apk**,
            and allow the install when Android asks (it is not from the Play Store).
            Updates install over the previous version and keep your progress.
          files: HanziFlow.apk
