<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Hanzi Flow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Serif+SC:wght@400;700&display=swap">
<style>
/* Layout: one 760px column of paper; practice areas borrow the 田字格 writing grid; bottom tab bar on every width. */
:root{
  --paper:#f1f2ee; --card:#ffffff; --card-2:#f7f8f5;
  --ink:#1b1f24; --ink-2:#535a64; --ink-3:#858c96;
  --line:#d8dbd4; --line-2:#e7e9e3;
  --accent:#2f4c8c; --accent-ink:#ffffff; --accent-soft:#e2e8f6;
  --seal:#b3302b;
  --good:#2b7a5c; --good-soft:#dcefe5;
  --almost:#a26a0f; --almost-soft:#f7ead0;
  --bad:#b3302b; --bad-soft:#f6dddb;
  --t1:#c2443a; --t2:#2e8a56; --t3:#2a63c4; --t4:#8a4fb0; --t5:#7c838c;
  --stage-1:#c7d2ec; --stage-2:#7d97d1; --stage-3:#2f4c8c;
  --shadow:0 1px 2px rgba(20,24,30,.05),0 10px 28px -14px rgba(20,24,30,.22);
  --display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --hanzi:"Kaiti SC","KaiTi","STKaiti","BiauKai","Noto Serif SC","Songti SC","SimSun",serif;
  --hanzi-ui:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif;
  --radius:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#14171b; --card:#1d2126; --card-2:#22272d;
  --ink:#e9e7e1; --ink-2:#aab0b8; --ink-3:#7b828c;
  --line:#2e343c; --line-2:#262b32;
  --accent:#94aae8; --accent-ink:#121a2c; --accent-soft:#273349;
  --seal:#e26b60;
  --good:#6fc099; --good-soft:#1e3a2e;
  --almost:#dcaa4f; --almost-soft:#3b2f16;
  --bad:#e26b60; --bad-soft:#44241f;
  --t1:#f07f73; --t2:#5fc78c; --t3:#7fa9f2; --t4:#c48fe3; --t5:#9ba2ab;
  --stage-1:#34436a; --stage-2:#5f7bc2; --stage-3:#a9bdf2;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 28px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#14171b; --card:#1d2126; --card-2:#22272d;
  --ink:#e9e7e1; --ink-2:#aab0b8; --ink-3:#7b828c;
  --line:#2e343c; --line-2:#262b32;
  --accent:#94aae8; --accent-ink:#121a2c; --accent-soft:#273349;
  --seal:#e26b60;
  --good:#6fc099; --good-soft:#1e3a2e;
  --almost:#dcaa4f; --almost-soft:#3b2f16;
  --bad:#e26b60; --bad-soft:#44241f;
  --t1:#f07f73; --t2:#5fc78c; --t3:#7fa9f2; --t4:#c48fe3; --t5:#9ba2ab;
  --stage-1:#34436a; --stage-2:#5f7bc2; --stage-3:#a9bdf2;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 28px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:28px;font-weight:800}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-2)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:56px}
.brand{display:flex;align-items:baseline;gap:8px;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em;white-space:nowrap}
@media (max-width:400px){.brand span:not(.zi){font-size:17px}.chip{padding:3px 8px;font-size:12px}}
.brand .zi{font-family:var(--hanzi);font-size:26px;color:var(--seal);font-weight:400}
.chips{margin-left:auto;display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
.chip b{color:var(--ink);font-weight:600}
.chip .zi{font-family:var(--hanzi);font-size:15px;color:var(--seal)}
#screen{padding-block:18px 110px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.card.soft{background:var(--card-2);border-color:var(--line-2)}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.small{font-size:13px}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.tnum{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;min-height:44px;text-decoration:none;transition:transform .08s ease,background .15s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;min-height:36px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:default}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card)}
.iconbtn svg{width:20px;height:20px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* pinyin + tones */
.py{font-family:var(--body);font-weight:500;letter-spacing:.01em}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}
.hz{font-family:var(--hanzi-ui)}
.hz-big{font-family:var(--hanzi);font-size:clamp(60px,17vw,112px);line-height:1.05;text-align:center;letter-spacing:.04em}
.hz-med{font-family:var(--hanzi);font-size:44px;line-height:1.1}
.tone-svg{width:34px;height:26px;color:currentColor}
/* home */
.hero{display:grid;gap:14px}
.rank{display:flex;align-items:center;gap:14px}
.rank .zi{font-family:var(--hanzi);font-size:40px;line-height:1;color:var(--seal);width:56px;text-align:center}
.bar{height:8px;background:var(--line-2);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .4s ease}
.bigcta{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:18px 20px;border-radius:var(--radius);background:var(--accent);color:var(--accent-ink);border:0;box-shadow:var(--shadow)}
.bigcta .t{font-family:var(--display);font-size:22px;font-weight:800;line-height:1.1}
.bigcta .s{opacity:.85;font-size:14px;margin-top:4px}
.bigcta .zi{font-family:var(--hanzi);font-size:44px;line-height:1;opacity:.95}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:520px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tilebtn{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border-radius:var(--radius);border:1px solid var(--line);background:var(--card);text-align:left;min-height:96px}
.tilebtn .zi{font-family:var(--hanzi);font-size:28px;line-height:1;color:var(--accent)}
.tilebtn b{font-family:var(--display);font-size:16px}
.tilebtn span{font-size:13px;color:var(--ink-2)}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;padding:0 max(12px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-right,0px))}
.tabs .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 8px;border:0;background:transparent;color:var(--ink-2);font-size:12px;font-weight:600}
.tab .zi{font-family:var(--hanzi);font-size:22px;line-height:1;color:var(--ink-3)}
.tab.active{color:var(--accent)}
.tab.active .zi{color:var(--seal)}
/* session */
.sess-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sess-top .bar{flex:1}
.task{display:grid;gap:18px}
.prompt{display:grid;place-items:center;gap:10px;padding:26px 16px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);min-height:170px;text-align:center}
.prompt .q{font-size:13px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.prompt .en{font-family:var(--display);font-size:26px;font-weight:700;max-width:28ch}
.prompt .py{font-size:30px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:17px;min-height:52px;transition:background .15s,border-color .15s}
.opt .key{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--card-2);color:var(--ink-3);border:1px solid var(--line-2)}
.opt .hz{font-size:24px}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.5}
.opt[disabled]{cursor:default}
.typebox{display:flex;gap:10px}
.typebox input{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:18px}
.feedback{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-radius:12px;border:1px solid var(--line)}
.feedback.good{background:var(--good-soft);border-color:var(--good)}
.feedback.almost{background:var(--almost-soft);border-color:var(--almost)}
.feedback.again{background:var(--bad-soft);border-color:var(--bad)}
.feedback .v{font-family:var(--display);font-weight:800;font-size:17px}
.feedback .d{font-size:14px;color:var(--ink-2)}
.feedback .py{font-size:18px}
.stagepill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--card-2);border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.stagepill i{width:8px;height:8px;border-radius:50%;background:var(--stage-2);display:inline-block}
.intro{display:grid;gap:16px}
.intro .head{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.intro .meanings{margin:0;padding-left:18px;font-size:17px}
.breakdown{display:grid;gap:8px}
.breakdown .ch{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:start;padding:10px 12px;border-radius:12px;background:var(--card-2);border:1px solid var(--line-2)}
.breakdown .ch .zi{font-family:var(--hanzi);font-size:36px;line-height:1;text-align:center}
.breakdown .ch .def{font-weight:500}
.breakdown .ch .hint{font-size:13px;color:var(--ink-2)}
.sent{display:grid;gap:4px;padding:12px 14px;border-radius:12px;border:1px solid var(--line-2);background:var(--card-2);cursor:pointer}
.sent .zh{font-family:var(--hanzi-ui);font-size:20px}
.sent .zh mark{background:transparent;color:var(--accent);font-weight:600}
.sent .pyl{font-size:13px;color:var(--ink-3)}
.sent .en{font-size:14px;color:var(--ink-2)}
.writers{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tzg{position:relative;width:min(260px,72vw);aspect-ratio:1;max-width:100%;border:2px solid var(--line);border-radius:6px;background:var(--card);overflow:hidden;touch-action:none}
.tzg::before,.tzg::after{content:"";position:absolute;inset:0;pointer-events:none}
.tzg::before{background:linear-gradient(var(--line-2),var(--line-2)) center/100% 1px no-repeat,linear-gradient(var(--line-2),var(--line-2)) center/1px 100% no-repeat}
.tzg::after{background:linear-gradient(to top right,transparent calc(50% - .5px),var(--line-2) 50%,transparent calc(50% + .5px)),linear-gradient(to top left,transparent calc(50% - .5px),var(--line-2) 50%,transparent calc(50% + .5px))}
.tzg svg{position:relative;z-index:1;width:100%;height:100%;display:block}
.tzg.sm{width:96px;border-width:1px}
.tzg.done{border-color:var(--good)}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--accent)}
.dots i.ok{background:var(--good)}
/* match board */
.board{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.board .col{display:grid;gap:10px;align-content:start}
.tile{display:flex;align-items:center;justify-content:center;gap:8px;min-height:58px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:17px;text-align:center;user-select:none;-webkit-user-select:none;transition:transform .12s,opacity .3s,border-color .12s,background .12s;word-break:break-word}
.tile.hz{font-family:var(--hanzi-ui);font-size:28px}
.tile.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent);background:var(--accent-soft)}
.tile.done{opacity:.18;pointer-events:none;transform:scale(.96)}
.tile.ok{border-color:var(--good);background:var(--good-soft)}
.tile.shake{animation:shake .4s;border-color:var(--bad);background:var(--bad-soft)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.scoreline{display:flex;align-items:center;gap:14px;font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.scoreline .big{font-size:28px}
.combo{font-size:13px;padding:2px 8px;border-radius:999px;background:var(--almost-soft);color:var(--almost);font-weight:700}
.timer{height:8px;background:var(--line-2);border-radius:4px;overflow:hidden}
.timer>i{display:block;height:100%;background:var(--accent);transition:width .1s linear}
.timer.low>i{background:var(--bad)}
.seal{width:64px;height:64px;border:3px solid var(--seal);color:var(--seal);display:grid;place-items:center;font-family:var(--hanzi);font-size:34px;border-radius:8px;transform:rotate(-7deg);flex:none}
.seal.two{font-size:22px;letter-spacing:-.05em}
/* lists */
.wrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 12px;border:0;border-bottom:1px solid var(--line-2);background:transparent}
.wrow:last-child{border-bottom:0}
.wrow .hz{font-size:24px;min-width:48px}
.wrow .m{color:var(--ink-2);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.fchip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:500}
.fchip.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:760px;max-height:88vh;overflow:auto;background:var(--paper);border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));border:1px solid var(--line);border-bottom:0}
.sheet .head{display:flex;align-items:flex-start;gap:14px}
/* progress */
.lvbar{display:grid;grid-template-columns:52px 1fr 60px;gap:10px;align-items:center;font-size:14px}
.lvbar .seg{display:flex;height:12px;gap:2px;border-radius:6px;overflow:hidden;background:var(--line-2)}
.lvbar .seg i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
.days{display:flex;gap:4px}
.days i{flex:1;aspect-ratio:1;border-radius:4px;background:var(--line-2);display:block}
.days i.d1{background:var(--stage-1)}.days i.d2{background:var(--stage-2)}.days i.d3{background:var(--stage-3)}
.stat{display:grid;gap:2px}
.stat b{font-family:var(--display);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.stat span{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.setrow:last-child{border-bottom:0}
.setrow label{font-weight:500}
.setrow .sub{font-size:13px;color:var(--ink-2)}
.setrow select,.setrow input[type=number]{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);min-width:90px}
.switch{position:relative;width:44px;height:26px;border-radius:13px;background:var(--line);border:0;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch.on{background:var(--good)}
.switch.on::after{left:21px}
textarea.data{width:100%;min-height:110px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-family:ui-monospace,monospace;font-size:12px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1}
.fade-in{animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pop{animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.kbd{font-size:11px;color:var(--ink-3)}
.ladder{display:grid;gap:6px;font-size:14px}
.ladder div{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:center}
.ladder i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;font-style:normal;color:var(--accent-ink);background:var(--accent)}
</style>

<header class="top"><div class="wrap">
  <div class="brand"><span class="zi">流</span><span>Hanzi Flow</span></div>
  <div class="chips" id="chips"></div>

<script>
(function(){
'use strict';
/* ---------------- data ---------------- */
const DAY=86400000, MIN=60000;
const V=window.CF_VOCAB||[];
const W=V.map((r,i)=>({id:i,s:r[0],t:r[1],p:r[2],y:r[3],m:r[4],l:r[5],pos:r[6]||'',cl:r[7]||''}));
const BY=new Map(W.map(w=>[w.s,w]));
const CH=window.CF_CHARS||{};
const SENT=window.CF_SENTENCES||[];
const SENT_BY=new Map();
SENT.forEach((s,i)=>{for(const w of s[4]){if(!SENT_BY.has(w))SENT_BY.set(w,[]);SENT_BY.get(w).push(i);}});
const LEVELS=[1,2,3,4,5,6];
const BY_LEVEL={};LEVELS.forEach(l=>BY_LEVEL[l]=W.filter(w=>w.l===l));
const STAGES=['New','Meaning','Sound','Listening','Recall','Produce','Writing','Mastered'];
const STAGE_HELP=['Not started yet','Pick the meaning when you see it','Pick the pronunciation when you see it','Pick the word when you hear it','Type the pinyin with tones from the characters','Type the pinyin from the English','Draw the characters from memory','Mixed review at long intervals'];
const RANKS=[[0,'童生','Tóngshēng','Student'],[400,'秀才','Xiùcai','Flourishing Talent'],[1500,'举人','Jǔrén','Recommended Scholar'],[4000,'贡士','Gòngshì','Tribute Scholar'],[9000,'进士','Jìnshì','Presented Scholar'],[18000,'探花','Tànhuā','Third Place'],[30000,'榜眼','Bǎngyǎn','Second Place'],[50000,'状元','Zhuàngyuan','Top Graduate']];
const POS={a:'adjective',ad:'adverbial adj.',an:'adj./noun',b:'attributive',c:'conjunction',d:'adverb',e:'interjection',f:'locality',g:'morpheme',h:'prefix',i:'idiom',j:'abbreviation',k:'suffix',l:'fixed phrase',m:'numeral',n:'noun',ng:'noun morpheme',nr:'name',ns:'place name',nt:'organization',nz:'proper noun',o:'onomatopoeia',p:'preposition',q:'measure word',r:'pronoun',s:'place',t:'time word',u:'particle',v:'verb',vd:'verb (adverbial)',vn:'verb/noun',w:'punctuation',x:'other',y:'modal particle',z:'descriptive'};

/* ---------------- helpers ---------------- */
const $=(s,r=document)=>r.querySelector(s);
function h(tag,attrs,...kids){const el=document.createElement(tag);if(attrs)for(const[k,v]of Object.entries(attrs)){if(v==null||v===false)continue;if(k==='class')el.className=v;else if(k==='html')el.innerHTML=v;else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);else if(k==='style')el.style.cssText=v;else el.setAttribute(k,v===true?'':v);}for(const kid of kids.flat(Infinity)){if(kid==null||kid===false)continue;el.append(kid.nodeType?kid:document.createTextNode(String(kid)));}return el;}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const todayKey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dayShift=n=>{const d=new Date();d.setDate(d.getDate()+n);return todayKey(d);};
const fuzz=ms=>ms*(0.92+Math.random()*0.16);
const ICON={speaker:'<svg class="i" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>',close:'<svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>',check:'<svg class="i" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></svg>',flame:'<svg class="i" viewBox="0 0 24 24"><path d="M12 22c4.4 0 7-2.8 7-7 0-3-2-5.5-3.5-7-.5 2-1.5 3-2.5 3.5 0-3-1.5-6-4-8 .5 3-1 4.5-2.5 6.5S5 13 5 15c0 4.2 2.6 7 7 7z"/></svg>',back:'<svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>',play:'<svg class="i" viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg>'};
function fmtDue(ms){const d=ms-Date.now();if(d<=0)return 'now';if(d<MIN*60)return Math.max(1,Math.round(d/MIN))+' min';if(d<DAY)return Math.round(d/3600000)+' h';return Math.round(d/DAY)+' d';}
function posText(w){return w.pos.split(',').filter(Boolean).map(p=>POS[p]||p).slice(0,2).join(', ');}

/* ---------------- pinyin ---------------- */
const MARKS={a:'āáǎà',e:'ēéěè',i:'īíǐì',o:'ōóǒò',u:'ūúǔù','ü':'ǖǘǚǜ'};
const TONED={};for(const[v,s]of Object.entries(MARKS))[...s].forEach((c,i)=>TONED[c]={v,t:i+1});
function markIndex(b){if(b.includes('a'))return b.indexOf('a');if(b.includes('e'))return b.indexOf('e');if(b.includes('ou'))return b.indexOf('o');for(let i=b.length-1;i>=0;i--)if('aeiouü'.includes(b[i]))return i;return -1;}
function mark(b,t){if(!t||t===5)return b;const i=markIndex(b);if(i<0)return b;return b.slice(0,i)+MARKS[b[i]][t-1]+b.slice(i+1);}
function pyEl(y,cls){return h('span',{class:'py '+(cls||'')},y.flatMap(([b,t],i)=>[i?' ':null,h('span',{class:'t'+t},mark(b,t))]));}
function pyText(y){return y.map(([b,t])=>mark(b,t)).join(' ');}
function normPinyinInput(str){let s=str.toLowerCase().trim().replace(/u:/g,'ü').replace(/v/g,'ü').replace(/[\s'’\-·.,，。]/g,'');let out='';for(const ch of s){const m=TONED[ch];out+=m?m.v+m.t:ch;}return out;}
function checkPinyin(input,y){const s=normPinyinInput(input);const bases=s.replace(/[0-5]/g,'');const want=y.map(x=>x[0]).join('');if(!bases||bases!==want)return 'wrong';const typed=[...s.matchAll(/[1-5]/g)].map(m=>+m[0]).filter(t=>t!==5);const need=y.map(x=>x[1]).filter(t=>t!==5);if(!typed.length&&need.length)return 'toneless';if(typed.length===need.length&&typed.every((t,i)=>t===need[i]))return 'good';return 'tones';}
function toneVariants(w,n){const key=s=>s.map(x=>x[1]).join('');const out=new Map();const orig=key(w.y);let g=0;const tonal=w.y.map((x,i)=>x[1]!==5?i:-1).filter(i=>i>=0);const idxPool=tonal.length?tonal:w.y.map((_,i)=>i);while(out.size<n&&g++<300){const y=w.y.map(([b,t])=>[b,t]);const k=Math.random()<0.6||idxPool.length<2?1:2;for(const i of shuffle(idxPool).slice(0,k)){let t;do{t=1+Math.floor(Math.random()*4);}while(t===y[i][1]);y[i][1]=t;}const kk=key(y);if(kk!==orig)out.set(kk,y);}return[...out.values()];}
function toneSVG(t){if(t===5)return'<svg class="tone-svg" viewBox="0 0 40 32" aria-hidden="true"><circle cx="20" cy="17" r="3.5" fill="currentColor"/></svg>';const p={1:'M5 7H35',2:'M6 24L34 7',3:'M5 11C11 31 21 31 35 8',4:'M6 6L34 26'}[t];return'<svg class="tone-svg" viewBox="0 0 40 32" aria-hidden="true"><path d="'+p+'" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg>';}

/* ---------------- state ---------------- */
const DEFAULTS={newPerDay:6,sessionSize:20,levels:[1],audio:true,autoplay:true,sfx:true,rate:0.85,voice:'',strictTones:false,trad:false,matchPairs:6,matchSide:'pinyin',matchTimer:true,suddenDeath:false,matchLevels:[1],tutorialSeen:false};
const state={items:{},stats:{xp:0,streak:0,lastDay:'',best:{},days:{},reviews:0,correct:0,settingsAt:0},settings:Object.assign({},DEFAULTS),ui:{screen:'home'}};
const LS_KEY='hanziflow.v1',LS_SESS='hanziflow.session';
function loadLocal(){try{const raw=localStorage.getItem(LS_KEY);if(raw){const o=JSON.parse(raw);Object.assign(state.items,o.items||{});Object.assign(state.stats,o.stats||{});Object.assign(state.settings,o.settings||{});}}catch(e){}if(!Array.isArray(state.settings.levels)||!state.settings.levels.length)state.settings.levels=[1];if(!Array.isArray(state.settings.matchLevels)||!state.settings.matchLevels.length)state.settings.matchLevels=state.settings.levels.slice();}
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(flushLocal,200);}
function flushLocal(){clearTimeout(saveT);saveT=null;try{localStorage.setItem(LS_KEY,JSON.stringify({v:1,items:state.items,stats:state.stats,settings:state.settings}));}catch(e){}cloud.scheduleWrite();}
function setSetting(k,v){state.settings[k]=v;state.stats.settingsAt=Date.now();cloud.dirty.add('meta');save();}
function dayRec(k=todayKey()){const d=state.stats.days;if(!d[k])d[k]={n:0,r:0,c:0,x:0};return d[k];}
function addXP(n){state.stats.xp+=n;dayRec().x+=n;cloud.dirty.add('meta');}
function touchStreak(){const t=todayKey();const s=state.stats;if(s.lastDay===t)return;s.streak=(s.lastDay===dayShift(-1))?s.streak+1:1;s.lastDay=t;cloud.dirty.add('meta');}
function rankFor(xp){let r=RANKS[0],next=null;for(let i=0;i<RANKS.length;i++){if(xp>=RANKS[i][0]){r=RANKS[i];next=RANKS[i+1]||null;}}return{r,next};}

/* ---------------- cloud sync (optional, claude.ai viewer only) ---------------- */
const cloud={db:null,uid:null,ready:false,dirty:new Set(),writing:false,timer:null,
  async init(){try{if(!window.claude||typeof window.claude.use!=='function')return;const[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);if(!db||!user)return;const uid=await user.id();if(!uid)return;this.db=db;this.uid=uid;await this.pull();this.ready=true;if(this.dirty.size)this.scheduleWrite();}catch(e){console.warn('sync unavailable',e);}},
  doc(name){return this.db.doc('data/users/'+this.uid+'/'+name);},
  async pull(){const names=['meta','l1','l2','l3','l4','l5','l6'];const snaps=await Promise.all(names.map(n=>this.doc(n).get()));let changed=false;const meta=snaps[0].exists?snaps[0].data():null;if(meta){changed=mergeStats(meta)||changed;}else this.dirty.add('meta');for(let l=1;l<=6;l++){const snap=snaps[l];const remote=snap.exists?(snap.data().items||{}):{};const local={};for(const[k,v]of Object.entries(state.items)){const w=BY.get(k);if(w&&w.l===l)local[k]=v;}let localNewer=false;for(const[k,v]of Object.entries(remote)){const cur=state.items[k];if(!cur||(v.n||0)>(cur.n||0)){state.items[k]=v;changed=true;}else if(cur&&(cur.n||0)>(v.n||0))localNewer=true;}for(const k of Object.keys(local))if(!remote[k])localNewer=true;if(localNewer)this.dirty.add('l'+l);}if(changed){save();render();}},
  payload(name){if(name==='meta')return{stats:state.stats,settings:state.settings,v:1};const l=+name.slice(1);const items={};for(const[k,v]of Object.entries(state.items)){const w=BY.get(k);if(w&&w.l===l)items[k]=v;}return{items,v:1};},
  scheduleWrite(){if(!this.ready)return;clearTimeout(this.timer);this.timer=setTimeout(()=>this.flush(),1500);},
  async flush(){if(this.writing||!this.ready)return;this.writing=true;try{while(this.dirty.size){const name=this.dirty.values().next().value;this.dirty.delete(name);await this.doc(name).set(this.payload(name));}}catch(e){console.warn('sync write failed',e);}finally{this.writing=false;if(this.dirty.size)this.scheduleWrite();}}
};
function mergeStats(meta){let changed=false;const r=meta.stats||{};const s=state.stats;if((r.xp||0)>s.xp){s.xp=r.xp;changed=true;}if((r.reviews||0)>s.reviews){s.reviews=r.reviews;changed=true;}if((r.correct||0)>s.correct){s.correct=r.correct;changed=true;}if((r.lastDay||'')>(s.lastDay||'')||((r.lastDay||'')===(s.lastDay||'')&&(r.streak||0)>s.streak)){s.streak=r.streak||0;s.lastDay=r.lastDay||'';changed=true;}for(const[k,v]of Object.entries(r.best||{}))if((v||0)>(s.best[k]||0)){s.best[k]=v;changed=true;}for(const[k,v]of Object.entries(r.days||{})){const d=s.days[k]||(s.days[k]={n:0,r:0,c:0,x:0});for(const f of['n','r','c','x'])if((v[f]||0)>d[f]){d[f]=v[f];changed=true;}}if(meta.settings&&(r.settingsAt||0)>(s.settingsAt||0)){Object.assign(state.settings,meta.settings);s.settingsAt=r.settingsAt;changed=true;}return changed;}

/* ---------------- audio ---------------- */
const audio={voices:[],voice:null,ctx:null,
  init(){if(!('speechSynthesis'in window))return;const load=()=>{try{this.voices=speechSynthesis.getVoices().filter(v=>/^zh|^cmn|chinese|mandarin/i.test(v.lang+' '+v.name));}catch(e){this.voices=[];}this.pick();};load();try{speechSynthesis.addEventListener('voiceschanged',load);}catch(e){}},
  pick(){const want=state.settings.voice;this.voice=this.voices.find(v=>v.voiceURI===want)||this.voices.find(v=>/zh[-_]CN|cmn[-_]Hans|cmn[-_]CN/i.test(v.lang))||this.voices.find(v=>/zh[-_]TW|cmn[-_]Hant/i.test(v.lang))||this.voices.find(v=>!/HK|yue/i.test(v.lang))||this.voices[0]||null;},
  get available(){return !!this.voice&&state.settings.audio;},
  speak(text,rate){if(!this.available)return false;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.voice=this.voice;u.lang=this.voice.lang||'zh-CN';u.rate=rate||state.settings.rate;u.pitch=1;speechSynthesis.speak(u);return true;}catch(e){return false;}},
  sfx(kind){if(!state.settings.sfx)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;this.ctx=this.ctx||new AC();const c=this.ctx;if(c.state==='suspended')c.resume();const t=c.currentTime;const seq={good:[523.25,783.99],perfect:[523.25,659.25,783.99,1046.5],almost:[440,440],bad:[220,165],tick:[880],start:[392,523.25,659.25]}[kind]||[440];seq.forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type=kind==='bad'?'triangle':'sine';o.frequency.value=f;const s=t+i*0.075;g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(0.09,s+0.012);g.gain.exponentialRampToValueAtTime(0.0001,s+0.19);o.connect(g).connect(c.destination);o.start(s);o.stop(s+0.2);});}catch(e){}}
};

/* ---------------- SRS ---------------- */
function rec(w){return state.items[w.s];}
function newRec(now){return{s:0,e:2.5,i:0,d:now,r:0,l:0,n:now,k:0};}
function grade(w,outcome,perfect){const now=Date.now();const it=state.items[w.s]||(state.items[w.s]=newRec(now));it.n=now;it.r++;
  if(outcome==='again'){it.l++;it.e=Math.max(1.3,it.e-0.2);it.i=0;it.k=1;it.s=Math.max(1,it.s-1);it.d=now+10*MIN;}
  else if(outcome==='almost'){it.i=it.i?Math.max(1,it.i*0.5):0;it.k=Math.max(it.k||0,1);it.d=now+10*MIN;}
  else{if(it.i===0){if((it.k||0)<1){it.k=1;it.d=now+10*MIN;}else{it.i=1;it.k=0;it.d=now+fuzz(DAY);}}else{it.i=it.i<1.5?3:Math.min(180,it.i*it.e);if(perfect)it.e=Math.min(3,it.e+0.05);it.d=now+fuzz(it.i*DAY);}it.s=Math.min(7,it.s+1);}
  cloud.dirty.add('l'+w.l);state.stats.reviews++;if(outcome==='good')state.stats.correct++;const d=dayRec();d.r++;if(outcome==='good')d.c++;touchStreak();return it;}
function introduce(w,known){const now=Date.now();state.items[w.s]=known?{s:4,e:2.5,i:3,d:now+fuzz(3*DAY),r:1,l:0,n:now,k:0}:{s:1,e:2.5,i:0,d:now,r:0,l:0,n:now,k:0};dayRec().n++;cloud.dirty.add('l'+w.l);touchStreak();addXP(5);}
function markKnown(w){const now=Date.now();const it=state.items[w.s]||(state.items[w.s]=newRec(now));it.s=7;it.i=30;it.d=now+fuzz(30*DAY);it.n=now;it.k=0;cloud.dirty.add('l'+w.l);save();}
function resetWord(w){delete state.items[w.s];cloud.dirty.add('l'+w.l);save();}
function dueWords(now=Date.now()){return W.filter(w=>{const it=state.items[w.s];return it&&it.s>0&&it.d<=now;}).sort((a,b)=>state.items[a.s].d-state.items[b.s].d);}
function newAllowance(){return Math.max(0,state.settings.newPerDay-(dayRec().n||0));}
function freshWords(n,levels){const out=[];for(const l of LEVELS){if(!levels.includes(l))continue;for(const w of BY_LEVEL[l]){if(out.length>=n)break;if(!state.items[w.s])out.push(w);}if(out.length>=n)break;}return out;}
function canWrite(w){return w.s.length<=3&&[...w.s].every(c=>CH[c]&&CH[c][5]>=1);}
const strokeLoads={};
function ensureStrokes(chars){const lv=new Set();for(const c of chars){const info=CH[c];if(info&&info[5]>=1)lv.add(info[5]);}return Promise.all([...lv].map(l=>{if(window.CF_STROKES_LOADED&&window.CF_STROKES_LOADED[l])return;if(!strokeLoads[l])strokeLoads[l]=new Promise((res,rej)=>{const s=document.createElement('script');s.src='data/strokes-'+l+'.js';s.onload=res;s.onerror=()=>{delete strokeLoads[l];rej(new Error('strokes '+l));};document.head.appendChild(s);});return strokeLoads[l];}));}
function hasStrokes(ch){return !!(window.CF_STROKES&&window.CF_STROKES[ch]);}
function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#888';}
function makeWriter(el,ch,opts){if(!window.HanziWriter||!hasStrokes(ch))return null;const size=opts.size||240;return HanziWriter.create(el,ch,Object.assign({width:size,height:size,padding:Math.round(size*0.08),showOutline:!!opts.outline,showCharacter:!!opts.showCharacter,strokeColor:cssVar('--ink'),outlineColor:cssVar('--line'),drawingColor:cssVar('--accent'),highlightColor:cssVar('--good'),drawingWidth:Math.max(8,Math.round(size/18)),strokeAnimationSpeed:1,delayBetweenStrokes:220,showHintAfterMisses:opts.hintAfter==null?2:opts.hintAfter,highlightOnComplete:true,charDataLoader:(c,onLoad,onError)=>{const d=window.CF_STROKES&&window.CF_STROKES[c];d?onLoad(d):onError(new Error('no stroke data'));}},opts.extra||{}));}

/* ---------------- distractors ---------------- */
function distractors(w,n,kind){const pool=BY_LEVEL[w.l].filter(x=>x!==w);let cands=[];if(kind==='hanzi'){const bases=new Set(w.y.map(s=>s[0]));const tones=w.y.map(s=>s[1]).join('');const sim=pool.filter(x=>x.s.length===w.s.length&&(x.y.some(s=>bases.has(s[0]))||x.y.map(s=>s[1]).join('')===tones));const shared=pool.filter(x=>[...x.s].some(c=>w.s.includes(c)));cands=shuffle(sim).concat(shuffle(shared),shuffle(pool.filter(x=>x.s.length===w.s.length)),shuffle(pool));}else if(kind==='meaning'){const pos=w.pos.split(',')[0];cands=shuffle(pool.filter(x=>pos&&x.pos.split(',')[0]===pos)).concat(shuffle(pool));}else{cands=shuffle(pool.filter(x=>x.y.length===w.y.length)).concat(shuffle(pool));}
  const out=[],seen=new Set([w.s]),seenM=new Set([w.m[0]]),seenP=new Set([w.p]);const take=x=>{if(seen.has(x.s)||seenM.has(x.m[0])||(kind==='pinyin'&&seenP.has(x.p)))return;seen.add(x.s);seenM.add(x.m[0]);seenP.add(x.p);out.push(x);};for(const x of cands){if(out.length>=n)break;take(x);}if(out.length<n)for(const x of shuffle(W)){if(out.length>=n)break;take(x);}return out;}

/* ---------------- UI plumbing ---------------- */
const screenEl=$('#screen');let cleanups=[];
function onLeave(fn){cleanups.push(fn);}
function clearScreen(){for(const f of cleanups){try{f();}catch(e){}}cleanups=[];screenEl.innerHTML='';window.scrollTo(0,0);}
let toastT;function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);}
