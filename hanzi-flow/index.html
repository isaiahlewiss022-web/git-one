<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hanzi Flow</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Serif+SC:wght@400;700&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="wrap">
        <div class="brand"><span class="zi">流</span><span>Hanzi Flow</span></div>
        <div class="chips" id="chips"></div>
        <button class="iconbtn" id="btn-settings" aria-label="Settings" title="Settings">
          <svg class="i" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"
            />
          </svg>
        </button>
      </div>
    </header>
    <main id="screen" class="wrap"></main>
    <nav class="tabs" aria-label="Sections"><div class="inner" id="tabs"></div></nav>
    <div id="toast" role="status"></div>

    <!-- Generated data tables (tools/build_data.py). Loaded before the app code. -->
    <script src="data/vocab.js"></script>
    <script src="data/chars.js"></script>
    <script src="data/sentences.js"></script>
    <!-- Stroke animation and writing quizzes (MIT, see vendor/hanzi-writer.LICENSE.txt). -->
    <script src="vendor/hanzi-writer.min.js"></script>
    <!-- The app, in load order. Each file is a plain script; they share one global scope. -->
    <script src="js/01-data.js"></script>
    <script src="js/02-helpers.js"></script>
    <script src="js/03-state.js"></script>
    <script src="js/04-audio.js"></script>
    <script src="js/05-srs.js"></script>
    <script src="js/06-ui.js"></script>
    <script src="js/07-home-flow.js"></script>
    <script src="js/08-play.js"></script>
    <script src="js/09-words-me.js"></script>
    <script src="js/10-main.js"></script>
  </body>
</html>
